<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | Carolina Blanquicett</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
        color: #0a0a0a;
        text-align: center;
        padding: 0 24px;
      }
      .label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #71717a;
      }
      h1 {
        font-size: clamp(3rem, 12vw, 6rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        line-height: 0.9;
      }
      .accent { color: #6d28d9; }
      a {
        display: inline-flex;
        align-items: center;
        height: 48px;
        padding: 0 32px;
        border: 2px solid #0a0a0a;
        border-radius: 12px;
        color: #0a0a0a;
        text-decoration: none;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: all 0.2s;
      }
      a:hover { background: #0a0a0a; color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        body { background: #000000; color: #ffffff; }
        a { border-color: #ffffff; color: #ffffff; }
        a:hover { background: #ffffff; color: #000000; }
      }
    </style>
  </head>
  <body>
    <p class="label">Error 404</p>
    <h1>Página no<br />encontrada<span class="accent">.</span></h1>
    <a href="/">Volver al inicio</a>
  </body>
</html>
